[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight-mcp"
version = "0.1.0"
description = "MCP server that explains laptop battery drain and sleep problems (macOS, Windows, Linux)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.20", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insight-mcp = "insight_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["insight_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
